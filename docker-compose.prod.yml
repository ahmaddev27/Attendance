# TAQAT v2 — production stack (VPS)
#
# Differences from docker-compose.yml (dev):
#   - runs published GHCR images instead of building locally; no source bind mounts
#   - config/secrets come from `.env` (copy from .env.example) via env_file + ${VAR} substitution
#   - restart: unless-stopped on every service
#   - every port is bound to 127.0.0.1 except nginx (80/443) — nginx is the only
#     service meant to be reachable from the public internet
#   - nginx fronts the API (php-fpm passthrough), the web app and Reverb; see
#     infra/docker/nginx/prod.conf and infra/docker/README.md for SSL setup
#
# Usage:
#   cp .env.example .env   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec -T api php artisan migrate --force

# Bounded log rotation for every container. Docker's default json-file
# driver has NO cap — a chatty container fills the host disk with
# multi-GB log files silently. 10MB × 5 files caps each container at
# ~50MB of on-disk log, plenty for post-incident triage without ever
# taking the VPS down for want of space.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-api-image: &api-image ghcr.io/${GHCR_OWNER:-OWNER}/taqat-api:${IMAGE_TAG:-latest}

x-api-env: &api-env
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-taqat}
  DB_USERNAME: ${DB_USERNAME:-taqat}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-taqat-app}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  # Native phpredis (compiled into the image) instead of apps/api's dev
  # default of predis — same Laravel Redis API, faster in production. Drop
  # this override if that turns out to be an unwanted divergence.
  REDIS_CLIENT: phpredis
  FILESYSTEM_DISK: s3
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-taqat_minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_DEFAULT_REGION: us-east-1
  # Bucket name is an app-level choice (apps/api/.env.example uses
  # `taqat-media`) — sourced from .env, not fixed here, so infra doesn't
  # silently diverge from what the API actually expects.
  AWS_BUCKET: ${AWS_BUCKET:-taqat-media}
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  # Required for Sanctum SPA cookie auth + CORS once web and api share one
  # public domain behind nginx (see docs/v2/01-architecture.md#7).
  SANCTUM_STATEFUL_DOMAINS: ${DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${DOMAIN}
  SESSION_DOMAIN: ${DOMAIN}
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax

services:
  db:
    <<: *default-logging
    image: mysql:8.4
    container_name: taqat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-taqat}
      MYSQL_USER: ${DB_USERNAME:-taqat}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [taqat]

  redis:
    <<: *default-logging
    image: redis:7-alpine
    container_name: taqat_redis
    restart: unless-stopped
    # Bounded memory + LRU eviction so a queue-backlog spike (jobs piling
    # up faster than they drain) can't consume every byte of RAM on the
    # box and start evicting active session data unpredictably.
    # Persistence is turned off: this Redis is only used for cache /
    # sessions / queues / Reverb pub-sub — every piece of state has a
    # canonical source elsewhere (MySQL, MinIO), so we treat it as a
    # pure warm memory tier and skip both RDB snapshots and AOF fsyncs.
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb --maxmemory-policy allkeys-lru
      --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [taqat]

  minio:
    <<: *default-logging
    image: minio/minio:latest
    container_name: taqat_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taqat_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [taqat]

  # api owns the read-write side of `api_app`. Its entrypoint (re)seeds this
  # volume from the image's immutable copy on every start (see
  # infra/docker/api/Dockerfile) — that's what lets nginx reach
  # public/index.php below without ever bind-mounting live source code.
  api:
    <<: *default-logging
    image: *api-image
    container_name: taqat_api
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    volumes:
      - api_app:/var/www/html
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 9000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [taqat]

  nginx:
    <<: *default-logging
    image: nginx:1.27-alpine
    container_name: taqat_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - api_app:/var/www/html:ro
      - ./infra/docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
      reverb: { condition: service_started }
    networks: [taqat]

  queue:
    <<: *default-logging
    image: *api-image
    container_name: taqat_queue
    restart: unless-stopped
    command: php artisan queue:work redis --tries=3 --backoff=5,30,120 --max-time=3600 --queue=notifications,ai,reports,default
    env_file: .env
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [taqat]

  scheduler:
    <<: *default-logging
    image: *api-image
    container_name: taqat_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [taqat]

  reverb:
    <<: *default-logging
    image: *api-image
    container_name: taqat_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    environment: *api-env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis: { condition: service_healthy }
    networks: [taqat]

  web:
    <<: *default-logging
    image: ghcr.io/${GHCR_OWNER:-OWNER}/taqat-web:${IMAGE_TAG:-latest}
    container_name: taqat_web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Server-only (never sent to the browser): lets Next.js call the API
      # over the internal Docker network instead of round-tripping through
      # its own public domain/TLS for server-side/SSR requests.
      INTERNAL_API_URL: http://nginx
      # NOTE: NEXT_PUBLIC_* values are NOT settable here — Next.js inlines
      # them into the build at compile time. They're passed as --build-arg in
      # .github/workflows/deploy.yml instead. See infra/docker/web/Dockerfile.
    ports:
      - "127.0.0.1:3000:3000"
    # Next.js never speaks to MySQL directly — the previous `depends_on: db`
    # had the web container blocked on a service it never opens a connection
    # to. Its real dependency is the api (Next.js SSR fans out to /api via
    # nginx). We can't depend on nginx here because nginx already depends
    # on web — instead wait for api to be healthy, which is what actually
    # matters for SSR to serve real data on first request.
    depends_on:
      api: { condition: service_healthy }
    networks: [taqat]

volumes:
  db_data:
  redis_data:
  minio_data:
  api_app:
  certbot_webroot:
  letsencrypt_certs:

networks:
  taqat:
    driver: bridge
