# TAQAT — VPS production stack (shared cPanel host)
#
# Sits BEHIND cPanel's Apache: Apache handles ports 80/443 + SSL and reverse
# proxies to the containers below. Every container binds only to 127.0.0.1
# so nothing is directly exposed to the public internet — Apache's proxy
# config is the single entry point.
#
# Public path              Bound at            Container
# ────────────────────────────────────────────────────────
# /api, /health, /storage  127.0.0.1:8180 →    nginx (php-fpm to api)
# /apps, /broadcasting     127.0.0.1:8182 →    reverb
# /                        127.0.0.1:8181 →    web  (Next.js)
# (SSH tunnel or WHM)      127.0.0.1:8186 →    minio console
#
# db, redis and the minio API stay on the internal Docker network only —
# they have no host-side port. That avoids collisions with cPanel's own
# Redis/MySQL and keeps them unreachable from outside the box.
#
# Usage:
#   cp .env.example .env   # then fill in real secrets
#   docker compose -f docker-compose.simple.yml build
#   docker compose -f docker-compose.simple.yml up -d
#   docker compose -f docker-compose.simple.yml exec -T api php artisan migrate --force

# All api-based services (api, queue, scheduler, reverb) share the same
# image. Defining it once here keeps them in lock-step and makes the file
# shorter. Docker Compose builds it once when any of them is built.
x-api-service: &api-service
  build:
    context: ./apps/api
    dockerfile: ../../infra/docker/api/Dockerfile
  image: taqat-api:local
  restart: unless-stopped
  env_file: .env
  volumes:
    - api_storage:/var/www/html/storage
  networks: [taqat]

services:
  db:
    image: mysql:8.4
    container_name: taqat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [taqat]

  redis:
    image: redis:7-alpine
    container_name: taqat_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [taqat]

  # Global search backend. Reachable only from other containers on the
  # `taqat` network — no host port binding, so the master key never
  # crosses the public boundary. Scout's queued indexer talks to it via
  # http://meilisearch:7700; the frontend never calls it directly.
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: taqat_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meilisearch_data:/meili_data
    networks: [taqat]

  minio:
    image: minio/minio:latest
    container_name: taqat_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-8186}:9001"
    volumes:
      - minio_data:/data
    networks: [taqat]

  api:
    <<: *api-service
    container_name: taqat_api
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    container_name: taqat_nginx
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-8180}:80"
    volumes:
      # The bind mount matters: nginx's try_files needs to see the same
      # public/ directory that php-fpm serves. api owns writes here; nginx
      # reads only.
      - ./apps/api:/var/www/html:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [taqat]

  queue:
    <<: *api-service
    container_name: taqat_queue
    command: php artisan queue:work redis --tries=3 --backoff=60
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    <<: *api-service
    container_name: taqat_scheduler
    command: php artisan schedule:work
    depends_on:
      db: { condition: service_healthy }

  reverb:
    <<: *api-service
    container_name: taqat_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "127.0.0.1:${REVERB_PORT:-8182}:8080"
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/web/Dockerfile
      # NEXT_PUBLIC_* must be baked in at build time (Next.js inlines them
      # into the client bundle). Defaults here match the production domain
      # + reverse-proxy layout above; override via .env for staging.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-attendees.taqatgaza.com}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-https}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY:-taqat-app-key}
    image: taqat-web:local
    container_name: taqat_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8181}:3000"
    networks: [taqat]

volumes:
  db_data:
  redis_data:
  minio_data:
  api_storage:
  meilisearch_data:

networks:
  taqat:
    driver: bridge
