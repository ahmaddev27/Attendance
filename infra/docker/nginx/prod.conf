# volume (/etc/letsencrypt/live/<domain>/{fullchain,privkey}.pem). Then, in the
# :80 server block above, replace everything inside `location /` with:
#     return 301 https://$host$request_uri;
# and remove its other locations (they're only needed on one active vhost).
