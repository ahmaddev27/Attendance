# TAQAT — production reverse proxy.
#
# nginx is the *only* service exposed to the public internet in
# docker-compose.prod.yml (ports 80/443). It routes:
#   /api/, /sanctum/, /broadcasting/  -> Laravel (php-fpm via fastcgi)
#   /app/, /apps/                     -> Reverb websockets (pusher-protocol paths)
#   everything else                   -> Next.js (web:3000)
#
# `root` below points at /var/www/html/public, which comes from the `api_app`
# named volume (mounted read-only here, read-write on the `api` service). The
# api container seeds/refreshes that volume from its own image on every start
# (see infra/docker/api/Dockerfile + entrypoint.sh) — nginx never bind-mounts
# live source code.
#
# SSL: ships HTTP-only so a brand new VPS comes up cleanly (also required for
# the Let's Encrypt HTTP-01 challenge below). Once a certificate exists,
# uncomment the HTTPS server block at the bottom, then replace the `location /`
# block in the :80 server with a redirect to https. See infra/docker/README.md
# for the exact certbot commands.

upstream web_upstream {
    server web:3000;
}

upstream reverb_upstream {
    server reverb:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Let's Encrypt HTTP-01 challenge: certbot --webroot -w /var/www/certbot ...
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- Laravel API --------------------------------------------------------
    location ~ ^/(api|sanctum|broadcasting)(/|$) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- Reverb (WebSockets) -------------------------------------------------
    location ~ ^/app(s)?/ {
        proxy_pass http://reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # --- Next.js frontend (everything else) -----------------------------------
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# -----------------------------------------------------------------------------
