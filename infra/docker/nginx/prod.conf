# TAQAT — production reverse proxy.
#
# nginx is the *only* service exposed to the public internet in
# docker-compose.prod.yml (ports 80/443). It routes:
#   /api/, /sanctum/, /broadcasting/  -> Laravel (php-fpm via fastcgi)
#   /app/, /apps/                     -> Reverb websockets (pusher-protocol paths)
#   everything else                   -> Next.js (web:3000)
#
# `root` below points at /var/www/html/public, which comes from the `api_app`
# named volume (mounted read-only here, read-write on the `api` service). The
# api container seeds/refreshes that volume from its own image on every start
# (see infra/docker/api/Dockerfile + entrypoint.sh) — nginx never bind-mounts
# live source code.
#
# SSL: ships HTTP-only so a brand new VPS comes up cleanly (also required for
# the Let's Encrypt HTTP-01 challenge below). Once a certificate exists,
# uncomment the HTTPS server block at the bottom, then replace the `location /`
# block in the :80 server with a redirect to https. See infra/docker/README.md
# for the exact certbot commands.

# --- Response compression --------------------------------------------------
# gzip cuts JSON API payloads and JS bundles by ~70%. Costs a small amount
# of CPU per request but the win on the wire (especially for slow mobile
# clients) is dramatically larger than the CPU cost of a 512-byte kernel
# gzip on the api box. min_length skips tiny bodies where the header
# overhead cancels the savings.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/x-font-ttf
    font/woff2
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# --- Rate-limit zones (http context) --------------------------------------
# Two zones keyed on the client IP:
#   - `api`  : general read/write API traffic; generous so real users on
#             a batch action (e.g. bulk toggle) don't get 503'd.
#   - `auth` : login/reset-password endpoints; stricter to make credential
#             stuffing painful without blocking a human retrying a typo.
# 10m of shared memory holds ~160k unique IPs per zone. `burst=` on the
# per-location rule below absorbs short spikes, `nodelay` serves the
# burst immediately (returning 503 only after the burst is exhausted)
# instead of queueing requests behind the leaky bucket.
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

upstream web_upstream {
    server web:3000;
}

upstream reverb_upstream {
    server reverb:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Default body limit for API + Next.js — 5MB is plenty for JSON /
    # form payloads. The upload endpoints below raise it to 32MB inside
    # their own locations so a single leaked-token abuser can't POST
    # 32MB blobs at every endpoint on the box.
    client_max_body_size 5M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Let's Encrypt HTTP-01 challenge: certbot --webroot -w /var/www/certbot ...
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- Auth endpoints (stricter rate limit) --------------------------------
    # Login and password-reset need their own tighter zone so credential
    # stuffing gets 503'd well before hitting Laravel's slow bcrypt path.
    # Matches only under /api/ so the SPA's public routes are untouched.
    # Case-insensitive and trailing-slash-tolerant so a client typing
    # /api/Login/ still hits the tighter bucket.
    location ~* ^/api/(login|logout|register|password/(email|reset)|reset-password|forgot-password)/?$ {
        limit_req zone=auth burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Upload endpoints (larger body allowance) ----------------------------
    # File and image upload routes accept up to 32MB; every other route
    # inherits the 5MB default set on the server block.
    location ~ ^/api/(uploads?|attachments?|media|files?)(/|$) {
        limit_req zone=api burst=60 nodelay;
        client_max_body_size 32M;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Laravel API --------------------------------------------------------
    location ~ ^/(api|sanctum|broadcasting)(/|$) {
        limit_req zone=api burst=120 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- Reverb (WebSockets) -------------------------------------------------
    location ~ ^/app(s)?/ {
        proxy_pass http://reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # --- Next.js frontend (everything else) -----------------------------------
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

