# Use Docker's embedded DNS (127.0.0.11) with a short TTL so nginx picks up
# the new upstream IP whenever the api container is recreated (rebuild, deploy,
# scale). Without this, `fastcgi_pass api:9000` resolves ONCE at startup and
# every subsequent request errors with 'connect() failed (113: Host is
# unreachable)' after any api container recreation.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    index index.php index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # A variable target forces nginx to resolve on every request instead
        # of caching the IP at startup (see the resolver directive above).
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 32M;
}
