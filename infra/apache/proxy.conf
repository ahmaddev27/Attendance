# TAQAT Apache reverse-proxy config
#
# Deploy to BOTH of these paths on the VPS:
#   /etc/apache2/conf.d/userdata/std/2_4/taqatgaza/attendees.taqatgaza.com/proxy.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/taqatgaza/attendees.taqatgaza.com/proxy.conf
#
# Then: /scripts/rebuildhttpdconf && systemctl restart httpd
#
# Rule ordering: ProxyPassMatch/Rewrite blocks first (they use regex and
# have highest precedence), then plain ProxyPass in longest-prefix-first
# order, with the "/" catch-all last. Apache processes ProxyPass in file
# order — first match wins — so "/" must sit at the bottom.

# --- Reverb WebSocket (M7 realtime) -----------------------------------------
RewriteEngine On

# Pusher-protocol WebSocket connection path (/app/{key} — singular)
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/app/(.*)$   ws://127.0.0.1:8182/app/$1   [P,L]

# Reverb events publish path (/apps/{id}/events — plural)
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/apps/(.*)$  ws://127.0.0.1:8182/apps/$1  [P,L]

# HTTP fallback (regex — takes precedence over plain ProxyPass)
ProxyPassMatch  ^/app/(.*)$   http://127.0.0.1:8182/app/$1
ProxyPassMatch  ^/apps/(.*)$  http://127.0.0.1:8182/apps/$1

# --- Laravel API (nginx → php-fpm) ------------------------------------------
ProxyPass        /api          http://127.0.0.1:8180/api
ProxyPassReverse /api          http://127.0.0.1:8180/api
ProxyPass        /broadcasting http://127.0.0.1:8180/broadcasting
ProxyPassReverse /broadcasting http://127.0.0.1:8180/broadcasting
ProxyPass        /sanctum      http://127.0.0.1:8180/sanctum
ProxyPassReverse /sanctum      http://127.0.0.1:8180/sanctum
ProxyPass        /storage      http://127.0.0.1:8180/storage
ProxyPassReverse /storage      http://127.0.0.1:8180/storage
ProxyPass        /health       http://127.0.0.1:8180/api/health
ProxyPassReverse /health       http://127.0.0.1:8180/api/health

# --- Next.js SPA (catch-all — MUST BE LAST) ---------------------------------
ProxyPass        /             http://127.0.0.1:8181/
ProxyPassReverse /             http://127.0.0.1:8181/

# --- Forward client info to backend -----------------------------------------
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port  "443"
