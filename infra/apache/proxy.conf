# TAQAT Apache reverse-proxy config
#
# Deploy to BOTH of these paths on the VPS:
#   /etc/apache2/conf.d/userdata/std/2_4/taqatgaza/attendees.taqatgaza.com/proxy.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/taqatgaza/attendees.taqatgaza.com/proxy.conf
#
# Then: /scripts/rebuildhttpdconf && systemctl restart httpd
#
# REQUIRED APACHE MODULES:
#   mod_proxy            — base
#   mod_proxy_http       — HTTP upstream
#   mod_proxy_wstunnel   — WebSocket upstream (or use the `upgrade=` form
#                          below, which needs 2.4.47+ and mod_proxy_http
#                          only)
#   mod_rewrite          — HTTP → HTTPS redirect + the acme-challenge skip
#   mod_headers          — X-Forwarded-Proto / X-Forwarded-Port
#
# In cPanel/WHM: EasyApache 4 → Modules → enable "Proxy Wstunnel"
# (mod_proxy_wstunnel). Without it the WS upgrade request 404s at the
# fall-through catch-all — the exact failure mode users kept reporting.
#
# ⚠ IMPORTANT — every rule below is wrapped in <Location "/…"> or
# <LocationMatch "…"> because cPanel merges the base template's own
# ProxyPass / (catch-all → whichever backend cPanel picks) into the
# same vhost. Plain ProxyPass matches by file order, so cPanel's
# catch-all fires FIRST and every request lands on the wrong upstream.
# <Location> takes precedence over plain ProxyPass regardless of order —
# it's the only reliable way to override a cPanel-generated ProxyPass /.

# --- Force HTTPS (only in the HTTP/:80 copy, not the SSL/:443 one) ----------
# cPanel's userdata std/ vs ssl/ separation means this block sits in both
# files. Wrap it in %{HTTPS}=off so it's a no-op inside the SSL VHost.
RewriteEngine On
RewriteCond %{HTTPS} off
RewriteCond %{HTTP:X-Forwarded-Proto} !=https
# Skip the ACME HTTP-01 challenge so Let's Encrypt renewals still work.
RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

# --- Reverb WebSocket (M7 realtime) -----------------------------------------
<Location "/app">
    ProxyPass         http://127.0.0.1:8182/app  upgrade=websocket  timeout=1200
    ProxyPassReverse  http://127.0.0.1:8182/app
</Location>

<Location "/apps">
    ProxyPass         http://127.0.0.1:8182/apps
    ProxyPassReverse  http://127.0.0.1:8182/apps
</Location>

# --- Laravel API (nginx → php-fpm) ------------------------------------------
# <Location> beats any plain `ProxyPass /` cPanel injects. Longest-prefix
# doesn't apply between <Location> and top-level ProxyPass — <Location>
# wins outright.
<Location "/api">
    ProxyPass         http://127.0.0.1:8180/api
    ProxyPassReverse  http://127.0.0.1:8180/api
</Location>

<Location "/broadcasting">
    ProxyPass         http://127.0.0.1:8180/broadcasting
    ProxyPassReverse  http://127.0.0.1:8180/broadcasting
</Location>

<Location "/sanctum">
    ProxyPass         http://127.0.0.1:8180/sanctum
    ProxyPassReverse  http://127.0.0.1:8180/sanctum
</Location>

<Location "/storage">
    ProxyPass         http://127.0.0.1:8180/storage
    ProxyPassReverse  http://127.0.0.1:8180/storage
</Location>

<Location "/health">
    ProxyPass         http://127.0.0.1:8180/api/health
    ProxyPassReverse  http://127.0.0.1:8180/api/health
</Location>

# --- Next.js SPA (catch-all) ------------------------------------------------
# Root <Location "/"> also overrides cPanel's default ProxyPass /, and
# apache is smart enough to prefer more-specific <Location> paths above
# over this one — so /api, /app, etc. still reach the API stack.
<Location "/">
    ProxyPass         http://127.0.0.1:8181/
    ProxyPassReverse  http://127.0.0.1:8181/
</Location>

# --- Forward client info to backend -----------------------------------------
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port  "443"
