# TAQAT Apache reverse-proxy config
#
# Deploy to BOTH of these paths on the VPS:
#   /etc/apache2/conf.d/userdata/std/2_4/taqatgaza/attendees.taqatgaza.com/proxy.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/taqatgaza/attendees.taqatgaza.com/proxy.conf
#
# Then: /scripts/rebuildhttpdconf && systemctl restart httpd
#
# REQUIRED APACHE MODULES:
#   mod_proxy            — base
#   mod_proxy_http       — HTTP upstream
#   mod_proxy_wstunnel   — WebSocket upstream (or use the `upgrade=` form
#                          below, which needs 2.4.47+ and mod_proxy_http
#                          only)
#   mod_rewrite          — HTTP → HTTPS redirect + the acme-challenge skip
#   mod_headers          — X-Forwarded-Proto / X-Forwarded-Port
#
# In cPanel/WHM: EasyApache 4 → Modules → enable "Proxy Wstunnel"
# (mod_proxy_wstunnel). Without it the WS upgrade request 404s at the
# fall-through catch-all — the exact failure mode users kept reporting.
#
# Rule ordering: ProxyPassMatch/Rewrite blocks first (they use regex and
# have highest precedence), then plain ProxyPass in longest-prefix-first
# order, with the "/" catch-all last. Apache processes ProxyPass in file
# order — first match wins — so "/" must sit at the bottom.

# --- Force HTTPS (only in the HTTP/:80 copy, not the SSL/:443 one) ----------
# cPanel's userdata std/ vs ssl/ separation means this block sits in both
# files. Wrap it in %{HTTPS}=off so it's a no-op inside the SSL VHost.
RewriteEngine On
RewriteCond %{HTTPS} off
RewriteCond %{HTTP:X-Forwarded-Proto} !=https
# Skip the ACME HTTP-01 challenge so Let's Encrypt renewals still work.
RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

# --- Reverb WebSocket (M7 realtime) -----------------------------------------
#
# Reverb speaks the Pusher protocol on two path prefixes:
#   /app/{key}            — client WS connection  (long-lived, `Upgrade: websocket`)
#   /apps/{id}/events     — server-side publish   (plain HTTPS POSTs)
#
# We use the `upgrade=websocket` argument to ProxyPass instead of a separate
# rewrite-to-ws:// rule. That form:
#   1. Handles both a regular HTTP GET (Pusher's fallback long-poll if a
#      client can't do WS) AND the `Upgrade: websocket` handshake with
#      the same directive — no `RewriteCond %{HTTP:Upgrade}` dance.
#   2. Requires only mod_proxy_http (not mod_proxy_wstunnel), which is
#      always available in EasyApache 4.
#   3. Needs Apache 2.4.47+ — cPanel's shipped Apache is well past that.
#
# ProxyPass under <Location> lets Apache handle sub-paths correctly.
<Location "/app">
    ProxyPass         http://127.0.0.1:8182/app  upgrade=websocket  timeout=1200
    ProxyPassReverse  http://127.0.0.1:8182/app
</Location>

<Location "/apps">
    ProxyPass         http://127.0.0.1:8182/apps
    ProxyPassReverse  http://127.0.0.1:8182/apps
</Location>

# Fallback for older Apaches that don't understand `upgrade=`. Harmless
# once the <Location> block above is in effect — the WS handshake matches
# the <Location> handler first. Kept as a safety net for a partial
# EasyApache config where the argument silently no-ops.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/app/(.*)$   ws://127.0.0.1:8182/app/$1   [P,L]
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/apps/(.*)$  ws://127.0.0.1:8182/apps/$1  [P,L]

# --- Laravel API (nginx → php-fpm) ------------------------------------------
ProxyPass        /api          http://127.0.0.1:8180/api
ProxyPassReverse /api          http://127.0.0.1:8180/api
ProxyPass        /broadcasting http://127.0.0.1:8180/broadcasting
ProxyPassReverse /broadcasting http://127.0.0.1:8180/broadcasting
ProxyPass        /sanctum      http://127.0.0.1:8180/sanctum
ProxyPassReverse /sanctum      http://127.0.0.1:8180/sanctum
ProxyPass        /storage      http://127.0.0.1:8180/storage
ProxyPassReverse /storage      http://127.0.0.1:8180/storage
ProxyPass        /health       http://127.0.0.1:8180/api/health
ProxyPassReverse /health       http://127.0.0.1:8180/api/health

# --- Next.js SPA (catch-all — MUST BE LAST) ---------------------------------
ProxyPass        /             http://127.0.0.1:8181/
ProxyPassReverse /             http://127.0.0.1:8181/

# --- Forward client info to backend -----------------------------------------
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port  "443"
