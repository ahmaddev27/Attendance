name: Build & Push Images

# Runs after CI succeeds on main. GitHub only evaluates `workflow_run`
# triggers using the workflow file already present on the default branch, so
# this won't fire until this file itself has been merged to main.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Manual trigger: Actions tab → "Build & Push Images" → Run workflow.
  # Useful for the very first deploy (workflow_run needs the file on main
  # first) or to redeploy without re-running CI.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # OPTIONAL: build & push images to GHCR.
  # The VPS currently builds locally (see the `deploy` job below), so this is
  # only useful if you later switch to `image:` pulls. Safe to keep — no cost
  # to the deploy path.
  # ---------------------------------------------------------------------------
  build-api:
    name: Build & push API image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./infra/docker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taqat-api:latest
            ghcr.io/${{ github.repository_owner }}/taqat-api:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build & push Web image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./infra/docker/web/Dockerfile
          push: true
          # NEXT_PUBLIC_* values are inlined at build time (see
          # infra/docker/web/Dockerfile) so they must be supplied here, not on
          # the VPS's .env. None of these are secret — they ship in the public
          # JS bundle by design — so they're repo Variables, not Secrets.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ vars.NEXT_PUBLIC_REVERB_APP_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taqat-web:latest
            ghcr.io/${{ github.repository_owner }}/taqat-web:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to the VPS over SSH.
  #
  # SAFETY GUARANTEES (this job intentionally NEVER):
  #   - overwrites .env or apps/api/.env  (both are .gitignored)
  #   - drops / truncates / seeds the database
  #   - deletes untracked files on the VPS (no `git clean`)
  #   - runs `migrate:fresh` — only `migrate --force` (adds new migrations)
  #
  # WHAT IT DOES:
  #   1. `git fetch && git reset --hard origin/main` — brings tracked files to
  #      match the commit that just passed CI. Untracked files (docker-compose.simple.yml,
  #      .env, database volumes) are left alone.
  #   2. Rebuilds only the app images (api, web) and recreates their containers.
  #      db/redis/minio containers keep running untouched.
  #   3. Runs `php artisan migrate --force` — additive only, no destructive ops.
  #   4. Caches config/route/view for prod.
  #
  # REQUIRED SECRETS (all already set in repo settings):
  #   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_SSH_PORT, VPS_APP_PATH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Deliberately does NOT depend on build-api/build-web — VPS builds locally,
    # so ghcr push failures shouldn't block the deploy.
    runs-on: ubuntu-latest
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - name: SSH → git pull → rebuild → migrate
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 30m
          # `set -euo pipefail` inside the script gives us fail-fast; the
          # v1 action removed `script_stop` so we don't need it here.
          script: |
            set -euo pipefail

            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            COMPOSE_FILE="docker-compose.simple.yml"

            cd "$APP_PATH"

            # If the SSH user (often root) differs from the directory owner,
            # git refuses with 'dubious ownership'. Safe here — the workflow
            # owns the deploy path — so we mark it trusted for git.
            git config --global --add safe.directory "$APP_PATH" || true

            echo "════════════════════════════════════════"
            echo "▶ 1/6  Pulling latest code from origin/main"
            echo "════════════════════════════════════════"
            git fetch origin main

            # Rescue any untracked file that's now tracked upstream — git
            # reset --hard refuses to clobber untracked files, and we'd
            # rather rename than lose them. Idempotent: once tracked, the
            # ls-files check makes this a no-op.
            for f in docker-compose.simple.yml infra/docker/nginx/default.conf; do
              if git ls-tree -r origin/main --name-only | grep -Fxq "$f"; then
                if [ -e "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                  BACKUP="${f}.pre-track.$(date +%Y%m%d-%H%M%S)"
                  echo "   ⚠ '$f' is now tracked upstream but currently untracked here — backing up to '$BACKUP'"
                  mv "$f" "$BACKUP"
                fi
              fi
            done

            BEFORE=$(git rev-parse HEAD)
            git reset --hard origin/main
            AFTER=$(git rev-parse HEAD)
            echo "   $BEFORE → $AFTER"

            # This deploy path REQUIRES the VPS-local docker-compose.simple.yml —
            # a custom file (not in git) tailored for the shared cPanel host:
            # binds only nginx:8180 / web:8181 / reverb:8182 and keeps db/redis/minio
            # on the Docker network. The dev docker-compose.yml would collide with
            # cPanel's Redis and expose ports we don't want public. Fail loudly
            # rather than silently deploying with the wrong config.
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "✗ ERROR: $COMPOSE_FILE missing in $APP_PATH"
              echo "  This file lives only on the VPS (untracked) — re-create it before retrying."
              exit 1
            fi
            DC="docker compose -f $COMPOSE_FILE"

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 2/6  Rebuilding api + web images"
            echo "════════════════════════════════════════"
            $DC build api web

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 3/6  Recreating containers (db/redis/minio untouched)"
            echo "════════════════════════════════════════"
            # up -d only recreates containers whose image or config changed;
            # db/redis/minio keep running since we didn't rebuild them.
            $DC up -d --remove-orphans

            # nginx is not rebuilt, so `up -d` leaves it running with a
            # cached (and now stale) IP for the fresh api container. Restart
            # it so `resolver` picks the new upstream IP up right away — the
            # config-level fix (variable fastcgi_pass) is layered on top of
            # this and covers future ad-hoc recreates.
            $DC restart nginx

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 4/6  Waiting for api container to be ready"
            echo "════════════════════════════════════════"
            for i in $(seq 1 30); do
              if $DC exec -T api php -v >/dev/null 2>&1; then
                echo "   api ready after ${i}s"
                break
              fi
              sleep 1
            done

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 5/6  Running migrations (additive only, --force, no seed)"
            echo "════════════════════════════════════════"
            $DC exec -T api php artisan migrate --force

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 6/6  Rebuilding Laravel caches for prod"
            echo "════════════════════════════════════════"
            $DC exec -T api php artisan config:clear
            $DC exec -T api php artisan config:cache
            $DC exec -T api php artisan route:cache
            $DC exec -T api php artisan view:cache
            # Storage symlink (idempotent — silent no-op if it already exists)
            $DC exec -T api php artisan storage:link 2>/dev/null || true

            echo ""
            echo "════════════════════════════════════════"
            echo "✓ Deploy complete: $AFTER"
            echo "════════════════════════════════════════"

      - name: Post-deploy health check
        run: |
          set -e
          echo "→ Checking https://attendees.taqatgaza.com/health"
          for i in $(seq 1 12); do
            if curl -sf --max-time 5 https://attendees.taqatgaza.com/health > /tmp/health.json; then
              echo "✓ API healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            # Fall back to plain HTTP while SSL isn't set up yet
            if curl -sf --max-time 5 http://attendees.taqatgaza.com/health > /tmp/health.json; then
              echo "✓ API healthy (HTTP): $(cat /tmp/health.json)"
              exit 0
            fi
            echo "   waiting for API (attempt ${i}/12)…"
            sleep 5
          done
          echo "✗ API did not respond to /health within 60s"
          exit 1
