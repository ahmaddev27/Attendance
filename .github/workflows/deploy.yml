name: Build & Push Images

# Runs after CI succeeds on main. GitHub only evaluates `workflow_run`
# triggers using the workflow file already present on the default branch, so
# this won't fire until this file itself has been merged to main.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Manual trigger: Actions tab → "Build & Push Images" → Run workflow.
  # Useful for the very first deploy (workflow_run needs the file on main
  # first) or to redeploy without re-running CI.
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build with --no-cache (nukes buildx cache first). Slow (~5-8 min), but bulletproof when a previous build left broken layers.'
        type: boolean
        required: false
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # OPTIONAL: build & push images to GHCR.
  # The VPS currently builds locally (see the `deploy` job below), so this is
  # only useful if you later switch to `image:` pulls. Safe to keep — no cost
  # to the deploy path.
  # ---------------------------------------------------------------------------
  build-api:
    name: Build & push API image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./infra/docker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taqat-api:latest
            ghcr.io/${{ github.repository_owner }}/taqat-api:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build & push Web image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./infra/docker/web/Dockerfile
          push: true
          # NEXT_PUBLIC_* values are inlined at build time (see
          # infra/docker/web/Dockerfile) so they must be supplied here, not on
          # the VPS's .env. None of these are secret — they ship in the public
          # JS bundle by design — so they're repo Variables, not Secrets.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ vars.NEXT_PUBLIC_REVERB_APP_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taqat-web:latest
            ghcr.io/${{ github.repository_owner }}/taqat-web:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to the VPS over SSH.
  #
  # SAFETY GUARANTEES (this job intentionally NEVER):
  #   - overwrites .env or apps/api/.env  (both are .gitignored)
  #   - drops / truncates / seeds the database
  #   - deletes untracked files on the VPS (no `git clean`)
  #   - runs `migrate:fresh` — only `migrate --force` (adds new migrations)
  #
  # WHAT IT DOES:
  #   1. `git fetch && git reset --hard origin/main` — brings tracked files to
  #      match the commit that just passed CI. Untracked files (docker-compose.simple.yml,
  #      .env, database volumes) are left alone.
  #   2. Rebuilds only the app images (api, web) and recreates their containers.
  #      db/redis/minio containers keep running untouched.
  #   3. Runs `php artisan migrate --force` — additive only, no destructive ops.
  #   4. Caches config/route/view for prod.
  #
  # REQUIRED SECRETS (all already set in repo settings):
  #   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_SSH_PORT, VPS_APP_PATH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Deliberately does NOT depend on build-api/build-web — VPS builds locally,
    # so ghcr push failures shouldn't block the deploy.
    runs-on: ubuntu-latest
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - name: Prepare SSH key
        # We accept EITHER a raw private key OR a base64-encoded one via
        # VPS_SSH_KEY. Base64 is the recommended path because copy-paste
        # into GitHub Secrets UI mangles line endings surprisingly often —
        # "ssh.ParsePrivateKey: no key found" is always that. Base64 is
        # a single line so nothing can go wrong.
        #
        # To use base64: on the VPS run
        #   `base64 -w 0 ~/.ssh/gha_deploy`
        # copy the single-line output, paste as VPS_SSH_KEY.
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          RAW="${{ secrets.VPS_SSH_KEY }}"

          # Try base64 first; if it decodes to something that looks like a
          # private key, use that. Otherwise fall back to the raw value.
          if echo "$RAW" | base64 -d 2>/dev/null | grep -q "PRIVATE KEY"; then
            echo "→ Detected base64-encoded key"
            echo "$RAW" | base64 -d > ~/.ssh/id_deploy
          else
            echo "→ Using raw key"
            printf '%s\n' "$RAW" > ~/.ssh/id_deploy
          fi

          # Trailing newline is required for OpenSSH — the printf above
          # adds one, base64-decode preserves the original's.
          chmod 600 ~/.ssh/id_deploy

          # Sanity: can openssh parse it?
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/pubkey 2>/dev/null; then
            echo "✗ FATAL: VPS_SSH_KEY is not a parseable OpenSSH private key"
            echo "  Fix by setting the secret to the base64-encoded key:"
            echo "  On the VPS: base64 -w 0 ~/.ssh/gha_deploy"
            echo "  Copy that single line into GitHub → Settings → Secrets → VPS_SSH_KEY"
            exit 1
          fi
          echo "→ Key parsed OK. Public key derives to:"
          cat /tmp/pubkey

          # Pin the host key so a MITM'd deploy can't happen and so the
          # first-connect prompt doesn't hang the SSH.
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT }}" -H "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          set -euo pipefail

          # Ship the deploy script inline over SSH. -T disables pty
          # allocation (cleaner logs), StrictHostKeyChecking=yes because
          # we just pinned the host key.
          ssh -T \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -i ~/.ssh/id_deploy \
            -p "$VPS_SSH_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "APP_PATH='$VPS_APP_PATH' NO_CACHE='$NO_CACHE' bash -s" << 'REMOTE_SCRIPT'
            set -euo pipefail

            APP_PATH="${APP_PATH:?APP_PATH missing}"
            COMPOSE_FILE="docker-compose.simple.yml"

            cd "$APP_PATH"

            # SSH user vs directory owner mismatch → git 'dubious ownership'
            git config --global --add safe.directory "$APP_PATH" || true

            # Fix: `.git/FETCH_HEAD: Permission denied` or `insufficient
            # permission for adding an object to repository database
            # .git/objects` happen when an operator SSHed into the box as
            # a DIFFERENT user (root, or `deploy`) and ran a git write op,
            # leaving files anywhere under .git owned by that user. The
            # GitHub Actions SSH deploy user then can't write to them.
            #
            # We probe MULTIPLE spots — top-level .git for FETCH_HEAD, and
            # .git/objects for object writes (the second-most-common
            # failure surface). Any probe failure triggers a recursive
            # chown of the whole .git tree, plus we use `find` to walk
            # .git looking for files owned by anyone else — that catches
            # a partial mismatch where the parent dirs are writable but
            # a nested subdir isn't.
            CURRENT="$(id -un):$(id -gn)"
            NEEDS_CHOWN=0
            touch .git/.taqat-write-probe 2>/dev/null && rm -f .git/.taqat-write-probe || NEEDS_CHOWN=1
            [ -d .git/objects ] && { touch .git/objects/.taqat-write-probe 2>/dev/null && rm -f .git/objects/.taqat-write-probe || NEEDS_CHOWN=1; }
            # Also detect files under .git owned by someone else — quick
            # for a normal-sized repo, and covers the case where our
            # probes happen to land in dirs we CAN write to but a git
            # write op will still hit a foreign-owned file elsewhere.
            if [ $NEEDS_CHOWN -eq 0 ]; then
              FOREIGN="$(find .git -not -user "$(id -un)" -print -quit 2>/dev/null)"
              [ -n "$FOREIGN" ] && NEEDS_CHOWN=1
            fi
            if [ $NEEDS_CHOWN -eq 1 ]; then
              echo "   ⚠ .git tree has foreign-owned files (running as $CURRENT) — realigning"
              sudo chown -R "$CURRENT" .git 2>/dev/null \
                || chown -R "$CURRENT" .git 2>/dev/null \
                || {
                  echo "   ✗ chown failed. Fix manually on the VPS as root:"
                  echo "     sudo chown -R $CURRENT $APP_PATH/.git"
                  exit 1
                }
              # Verify with the same two probes — abort loudly instead of
              # letting git fetch fail with the same cryptic error.
              touch .git/.taqat-write-probe 2>/dev/null && rm -f .git/.taqat-write-probe || {
                echo "   ✗ Still cannot write to .git after chown — aborting deploy"
                exit 1
              }
              [ -d .git/objects ] && { touch .git/objects/.taqat-write-probe 2>/dev/null && rm -f .git/objects/.taqat-write-probe || {
                echo "   ✗ Still cannot write to .git/objects after chown — aborting deploy"
                exit 1
              }; }
              echo "   ✓ .git ownership realigned to $CURRENT"
            fi

            echo "════════════════════════════════════════"
            echo "▶ 1/8  Pulling latest code from origin/main"
            echo "════════════════════════════════════════"

            # HARD SAFETY: .env is never touched by the deploy path. Verify
            # it is git-ignored so no reset can wipe it. If someone accidentally
            # committed it, abort loudly rather than deploy over their secrets.
            if git ls-files --error-unmatch .env >/dev/null 2>&1; then
              echo "✗ FATAL: .env is tracked in git — deploy refuses to run"
              echo "  Remove it from the index: git rm --cached .env && commit"
              exit 1
            fi
            [ -f .env ] && cp .env .env.pre-deploy.$(date +%Y%m%d-%H%M%S) && \
              echo "   ✓ .env backed up before pull"

            git fetch origin main

            # Rescue any file that's now tracked upstream but currently
            # untracked here — git reset --hard refuses to clobber untracked
            # files, so we rename rather than lose them.
            for f in docker-compose.simple.yml infra/docker/nginx/default.conf; do
              if git ls-tree -r origin/main --name-only | grep -Fxq "$f"; then
                if [ -e "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                  BACKUP="${f}.pre-track.$(date +%Y%m%d-%H%M%S)"
                  echo "   ⚠ '$f' is tracked upstream but untracked here — backing up to '$BACKUP'"
                  mv "$f" "$BACKUP"
                fi
              fi
            done

            BEFORE=$(git rev-parse HEAD)
            git reset --hard origin/main
            AFTER=$(git rev-parse HEAD)
            echo "   $BEFORE → $AFTER"

            # Detect what changed — informs which containers actually need rebuild
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || echo "all")
            echo "   Changed files: $(echo "$CHANGED_FILES" | wc -l) file(s)"

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "✗ ERROR: $COMPOSE_FILE missing in $APP_PATH"
              exit 1
            fi
            DC="docker compose -f $COMPOSE_FILE"

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 2/8  Sync composer.lock if composer.json changed"
            echo "════════════════════════════════════════"
            # If composer.json changed but composer.lock didn't (e.g. someone
            # added a package manually), regenerate the lock via the composer
            # image so 'composer install' inside the Dockerfile succeeds.
            if echo "$CHANGED_FILES" | grep -q "^apps/api/composer.json$" && \
               ! echo "$CHANGED_FILES" | grep -q "^apps/api/composer.lock$"; then
              echo "   composer.json changed but lock did not — regenerating"
              docker run --rm -v "$(pwd)/apps/api:/app" -w /app \
                composer:2 config policy.advisories.block false >/dev/null 2>&1 || true
              docker run --rm -v "$(pwd)/apps/api:/app" -w /app \
                composer:2 update --no-scripts --no-interaction \
                --ignore-platform-reqs --no-audit --lock
            else
              echo "   composer.lock is in sync — skipping"
            fi

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 3/8  Rebuilding api + web images"
            echo "════════════════════════════════════════"
            # workflow_dispatch `no_cache: true` → nuke the buildx cache
            # first, then build with --no-cache. Slow (~5-8 min) but
            # rescues a stuck deploy where a previous partial-install
            # left cached layers that keep referencing files that were
            # never actually downloaded (symfony/polyfill-mbstring was
            # the recurring symptom).
            if [ "${NO_CACHE:-false}" = "true" ]; then
              echo "   ⚠ --no-cache requested — pruning buildx cache first"
              docker builder prune -af || true
              $DC build --pull --no-cache api web
            else
              $DC build --pull api web
            fi

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 4/8  Recreating containers (db/redis/minio untouched)"
            echo "════════════════════════════════════════"
            # --force-recreate ensures containers pick up new .env values even
            # when only env vars (not the image) changed. db/redis/minio are
            # intentionally listed EXCEPT so their data volumes stay attached
            # and their processes are never interrupted.
            $DC up -d --no-deps --force-recreate api web queue scheduler reverb

            # Bring up any stateful backing services that were added to the
            # compose file but aren't yet running on the VPS (e.g. meilisearch
            # arrived with Phase 2). `up -d` is a no-op for services that are
            # already healthy, and never recreates db/redis/minio — their
            # data volumes stay attached.
            $DC up -d db redis minio meilisearch

            # nginx needs a restart AFTER api is recreated so its resolver
            # picks up the fresh api container IP right away (the resolver
            # 10s TTL is the safety net for future recreates).
            $DC restart nginx

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 5/8  Waiting for api container to be ready"
            echo "════════════════════════════════════════"
            for i in $(seq 1 60); do
              if $DC exec -T api php artisan --version >/dev/null 2>&1; then
                echo "   api ready after ${i}s"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "   ✗ api never became ready — dumping logs"
                $DC logs --tail=50 api
                exit 1
              fi
              sleep 1
            done

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 6/8  Running migrations (additive only)"
            echo "════════════════════════════════════════"
            $DC exec -T api php artisan migrate --force

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 7/8  Rebuilding Laravel caches for prod"
            echo "════════════════════════════════════════"
            $DC exec -T api php artisan config:clear
            $DC exec -T api php artisan config:cache
            $DC exec -T api php artisan route:cache
            $DC exec -T api php artisan view:cache
            $DC exec -T api php artisan storage:link 2>/dev/null || true

            echo ""
            echo "════════════════════════════════════════"
            echo "▶ 8/8  Verifying containers + pruning old images"
            echo "════════════════════════════════════════"
            # Every app service should be running post-deploy. If any is stuck
            # in Restarting / Exit, surface it here so the workflow fails
            # loudly instead of leaving a half-broken stack alive.
            EXPECTED="db redis minio meilisearch api nginx web queue scheduler reverb"
            for svc in $EXPECTED; do
              STATUS=$($DC ps --format '{{.State}}' "$svc" 2>/dev/null || echo "missing")
              if [ "$STATUS" != "running" ]; then
                echo "   ✗ $svc: $STATUS"
                $DC logs --tail=30 "$svc" || true
                exit 1
              fi
              echo "   ✓ $svc: running"
            done

            # Dangling images pile up after every rebuild (old layers no image
            # tag points at). Prune them so /var/lib/docker doesn't grow
            # forever. --filter until= keeps images built in the last hour so
            # a rollback via `docker tag` still works.
            echo ""
            echo "→ Pruning dangling images older than 1h"
            docker image prune -f --filter "until=60m" || true
            # Cap the buildx cache to keep the disk in check without paying
            # a full cold-build cost on every deploy.
            echo "→ Trimming build cache to 3GB"
            docker builder prune -f --keep-storage 3g || true

            echo ""
            echo "════════════════════════════════════════"
            echo "✓ Deploy complete: $AFTER"
            echo "════════════════════════════════════════"
          REMOTE_SCRIPT

      - name: Post-deploy health check
        # Runs OVER SSH — checks the API from inside the box, through
        # nginx. External health via public DNS/SSL is a separate
        # (network/DNS/cert) concern that should not fail the deploy;
        # if containers are healthy through the reverse proxy, the
        # deploy did its job.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -e
          echo "→ Health-check via SSH: nginx → api → /api/health"
          ssh -T \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_deploy \
            -p "$VPS_SSH_PORT" \
            "$VPS_USER@$VPS_HOST" << 'REMOTE_HEALTH'
            set -e
            # Hit nginx directly on localhost — bypasses DNS + SSL. Any
            # 2xx here means the app is serving requests end-to-end
            # inside the box; external reachability is orthogonal.
            for i in $(seq 1 12); do
              # -k skips cert validation (still checks reachability), -H
              # pins the Host header so nginx picks the right vhost.
              if curl -sfk --max-time 5 \
                  -H "Host: attendees.taqatgaza.com" \
                  http://127.0.0.1/api/health > /tmp/health.json 2>/dev/null; then
                echo "✓ API healthy: $(cat /tmp/health.json)"
                exit 0
              fi
              echo "   waiting for nginx→api (attempt ${i}/12)…"
              sleep 5
            done
            echo "✗ API did not respond to /api/health within 60s (checking from INSIDE the VPS)"
            echo "→ Dumping the last 20 nginx access log lines:"
            docker compose -f docker-compose.simple.yml logs --tail=20 nginx 2>/dev/null || true
            exit 1
          REMOTE_HEALTH
