name: Build & Push Images

# Runs after CI succeeds on main. GitHub only evaluates `workflow_run`
# triggers using the workflow file already present on the default branch, so
# this won't fire until this file itself has been merged to main.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-api:
    name: Build & push API image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./infra/docker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taqat-api:latest
            ghcr.io/${{ github.repository_owner }}/taqat-api:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build & push Web image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./infra/docker/web/Dockerfile
          push: true
          # NEXT_PUBLIC_* values are inlined at build time (see
          # infra/docker/web/Dockerfile) so they must be supplied here, not on
          # the VPS's .env. None of these are secret — they ship in the public
          # JS bundle by design — so they're repo Variables, not Secrets.
          # Configure them under Settings -> Secrets and variables -> Actions -> Variables.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ vars.NEXT_PUBLIC_REVERB_APP_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taqat-web:latest
            ghcr.io/${{ github.repository_owner }}/taqat-web:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to the VPS over SSH. Disabled until the VPS is provisioned.
  #
  # Requires GitHub secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, GHCR_TOKEN (or GITHUB_TOKEN)
  # (GHCR auth above already reuses the built-in GITHUB_TOKEN — you only need a
  # separate GHCR_TOKEN if the VPS pulls images itself using a PAT instead of
  # `docker login` with a token you provision another way.)
  #
  # To enable:
  #   1. Provision the VPS, install Docker + Docker Compose.
  #   2. `git clone` this repo to /srv/taqat on the VPS.
  #   3. Copy .env.example to /srv/taqat/.env and fill in real secrets.
  #   4. Add the VPS_HOST / VPS_USER / VPS_SSH_KEY secrets in
  #      Settings -> Secrets and variables -> Actions.
  #   5. Uncomment the job below.
