name: Build & Push Images

# Runs after CI succeeds on main. GitHub only evaluates `workflow_run`
# triggers using the workflow file already present on the default branch, so
# this won't fire until this file itself has been merged to main.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Manual trigger: Actions tab → "Build & Push Images" → Run workflow.
  # Useful for the very first deploy (workflow_run needs the file on main
  # first) or to redeploy without re-running CI.
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build with --no-cache (nukes buildx cache first). Slow (~5-8 min), but bulletproof when a previous build left broken layers.'
        type: boolean
        required: false
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # OPTIONAL: build & push images to GHCR.
  # The VPS currently builds locally (see the `deploy` job below), so this is
  # only useful if you later switch to `image:` pulls. Safe to keep — no cost
  # to the deploy path.
  # ---------------------------------------------------------------------------
  #
  # Every job below runs only for a manual dispatch or for a CI run that a
  # PUSH to this repository's main produced. CI also runs on pull requests,
  # fork PRs included, and a fork branch named "main" passes the `branches`
  # filter above; without the event/repository checks such a PR's scripts
  # would run here with the VPS SSH key and a package-write token.
  # ---------------------------------------------------------------------------
  build-api:
    name: Build & push API image
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./infra/docker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taqat-api:latest
            ghcr.io/${{ github.repository_owner }}/taqat-api:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build & push Web image
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./infra/docker/web/Dockerfile
          push: true
          # NEXT_PUBLIC_* values are inlined at build time (see
          # infra/docker/web/Dockerfile) so they must be supplied here, not on
          # the VPS's .env. None of these are secret — they ship in the public
          # JS bundle by design — so they're repo Variables, not Secrets.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ vars.NEXT_PUBLIC_REVERB_APP_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taqat-web:latest
            ghcr.io/${{ github.repository_owner }}/taqat-web:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to the VPS over SSH.
  #
  # The remote program lives in infra/scripts/vps-deploy.sh (with helpers in
  # infra/scripts/lib/vps-common.sh) so it can be linted in CI and rehearsed
  # locally. In short: sync code → build → migrate with the new image while the
  # old release still serves → switch containers → caches → health gate on
  # /api/health → automatic rollback to the previous images if anything after
  # the switch fails.
  #
  # SAFETY GUARANTEES (the script NEVER):
  #   - overwrites .env
  #   - drops / truncates / seeds the database or runs migrate:fresh
  #   - deletes untracked files on the VPS (no `git clean`)
  #
  # REQUIRED SECRETS: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_SSH_PORT, VPS_APP_PATH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    # Deliberately does NOT depend on build-api/build-web — the VPS builds
    # locally, so ghcr push failures shouldn't block the deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Shared with the backup and restore workflows so a dump never races a
    # migration.
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: |
            .github/actions
            infra/scripts

      - name: Prepare SSH key
        uses: ./.github/actions/vps-ssh
        with:
          ssh-key: ${{ secrets.VPS_SSH_KEY }}
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          NO_CACHE: ${{ inputs.no_cache }}
          # The commit CI verified; the VPS deploys exactly this one, not
          # whatever main points at by the time this job runs.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REMOTE_ENV: APP_PATH NO_CACHE DEPLOY_SHA
        run: bash infra/scripts/run-on-vps.sh infra/scripts/lib/vps-common.sh infra/scripts/vps-deploy.sh
