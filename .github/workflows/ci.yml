name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API (PHP 8.4 / Pest)
    runs-on: ubuntu-latest

    # Mirrors the credentials used by docker-compose.yml / infra/docker/mysql/init.sql
    # so local dev and CI stay aligned. apps/api's own .env.testing / phpunit.xml
    # may override these — adjust here if it configures something different.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: taqat_testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          # Must match infra/docker/api/Dockerfile — some deps (symfony/clock 8.1,
          # nesbot/carbon 3.13) hard-require PHP >= 8.4.1 in composer.lock.
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, redis, gd, zip, bcmath, exif, pcntl, opcache
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      # `composer install` runs Laravel's post-autoload-dump hook, which calls
      # `php artisan package:discover`. That command bootstraps the framework
      # and Laravel 11's Application::configure() throws "A facade root has
      # not been set" whenever APP_KEY is missing (the Encrypter binds itself
      # eagerly, then the Facade layer explodes when the key is empty). So
      # we need BOTH a readable .env AND a real APP_KEY before any artisan
      # command runs. Seeding the key with `sed` avoids the chicken-and-egg
      # of running `key:generate` (which is itself an artisan command that
      # would boot the framework and hit the same wall).
      - name: Prepare .env with a real APP_KEY for post-install scripts
        run: |
          [ -f .env ] || cp .env.example .env
          KEY="base64:$(head -c 32 /dev/urandom | base64)"
          # `|` delimiter because the key itself contains `/` and `+`
          # (base64 alphabet) and would break the default `/` separator.
          sed -i "s|^APP_KEY=.*|APP_KEY=$KEY|" .env
          # SANITY: fail loud if the substitution didn't take — every
          # downstream step assumes APP_KEY is set.
          grep -q "^APP_KEY=base64:" .env

      - name: Install PHP dependencies
        # Three failure modes we've seen in practice:
        #   1. composer.lock genuinely up-to-date → `composer install` succeeds
        #      and this is the fast path.
        #   2. composer.json gained a package (e.g. laravel/reverb) without a
        #      matching lock update → `install` fails, so we fall through to
        #      `update -W` to sync the lock in place.
        #   3. Packagist's advisories DB blocks the resolution because a
        #      locked laravel/framework version has security advisories → we
        #      disable the block for the CI run only (never persisted).
        # `--ignore-platform-reqs` covers CI images missing niche extensions;
        # `--no-scripts` defers package:discover to the next step so the
        # command runs against a fully-prepared env instead of aborting on
        # a missing APP_KEY.
        # NOTE: no `--no-audit` here — that flag arrived in composer 2.6 and
        # the shivammathur runner sometimes lands us on an older composer;
        # the older one hard-errors with "The --no-audit option does not
        # exist" instead of ignoring it.
        run: |
          composer config policy.advisories.block false
          composer install --no-progress --prefer-dist --no-interaction --no-scripts \
            || composer update --no-progress --prefer-dist --no-interaction \
                              --with-all-dependencies --ignore-platform-reqs --no-scripts

      - name: Discover packages
        # APP_KEY is already set in .env from the previous step, so artisan
        # can boot cleanly. This is the same command Composer's
        # post-autoload-dump hook would run — calling it directly here
        # surfaces provider errors with Laravel's own message instead of
        # composer's generic "run-script failed" wrapper.
        run: php artisan package:discover --ansi

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taqat_testing
          DB_USERNAME: root
          DB_PASSWORD: ""
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          SESSION_DRIVER: array

  web-build:
    name: Web (Node 20 / Next.js build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # `npm ci` requires package-lock.json to be in perfect sync with
        # package.json — a new dependency added without regenerating the
        # lock (common when you add via PR review) breaks it. Fall back to
        # `npm install` (which updates the lock) so CI recovers instead
        # of failing on a paperwork gap.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Placeholder values are fine here — this job only verifies the
          # build succeeds, it doesn't ship the resulting artifact. Real
          # production values are baked in by .github/workflows/deploy.yml.
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_REVERB_HOST: localhost
          NEXT_PUBLIC_REVERB_PORT: "8080"
          NEXT_PUBLIC_REVERB_APP_KEY: taqat-app-key

  ci-status:
    name: CI status
    if: always()
    needs: [api-tests, web-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
