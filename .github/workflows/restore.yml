name: Restore database

# Replaces the production database with a backup from the VPS backups folder.
# Destructive: a safety dump of the current data is taken first and put back
# automatically if the import fails. Runbook: docs/deployment/backup-restore.md.
on:
  workflow_dispatch:
    inputs:
      backup:
        description: 'Backup file name (db-YYYYmmdd-HHMMSS.sql.gz) or "latest"'
        required: true
        default: latest
      confirm:
        description: 'Type exactly: restore production database'
        required: true

permissions:
  contents: read

jobs:
  restore:
    name: Restore production database
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - name: Require the typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "restore production database" ]; then
            echo "::error title=Not confirmed::The confirmation text does not match. Nothing was changed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            infra/scripts

      - name: Prepare SSH key
        uses: ./.github/actions/vps-ssh
        with:
          ssh-key: ${{ secrets.VPS_SSH_KEY }}
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}

      - name: Restore
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          RESTORE_BACKUP: ${{ inputs.backup }}
          RESTORE_CONFIRM: ${{ inputs.confirm }}
          REMOTE_ENV: APP_PATH RESTORE_BACKUP RESTORE_CONFIRM
        run: bash infra/scripts/run-on-vps.sh infra/scripts/lib/vps-common.sh infra/scripts/vps-restore.sh
