name: Prepare VPS SSH access
description: Writes the deploy key to ~/.ssh/id_deploy and pins the VPS host key, so later steps can call ssh non-interactively.

inputs:
  ssh-key:
    description: The VPS_SSH_KEY secret — a raw OpenSSH private key or the same key base64-encoded on one line.
    required: true
  host:
    description: VPS host name or IP.
    required: true
  port:
    description: VPS SSH port.
    required: true

runs:
  using: composite
  steps:
    - name: Write deploy key and pin host key
      shell: bash
      env:
        RAW_KEY: ${{ inputs.ssh-key }}
        VPS_HOST: ${{ inputs.host }}
        VPS_SSH_PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        # Base64 is the recommended secret format: pasting a multi-line key
        # into the GitHub Secrets UI mangles line endings surprisingly often,
        # and "ssh.ParsePrivateKey: no key found" is always that.
        if printf '%s' "$RAW_KEY" | base64 -d 2>/dev/null | grep -q "PRIVATE KEY"; then
          echo "→ Detected base64-encoded key"
          printf '%s' "$RAW_KEY" | base64 -d > ~/.ssh/id_deploy
        else
          echo "→ Using raw key"
          printf '%s\n' "$RAW_KEY" > ~/.ssh/id_deploy
        fi
        chmod 600 ~/.ssh/id_deploy

        if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
          echo "✗ FATAL: VPS_SSH_KEY is not a parseable OpenSSH private key"
          echo "  Fix by setting the secret to the base64-encoded key:"
          echo "  On the VPS: base64 -w 0 ~/.ssh/gha_deploy"
          echo "  Copy that single line into GitHub → Settings → Secrets → VPS_SSH_KEY"
          exit 1
        fi

        # Pin the host key so a MITM'd session can't happen and the
        # first-connect prompt can't hang the job.
        ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        echo "→ SSH key ready"
